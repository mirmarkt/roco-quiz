<head>

<title>测试你是什么洛克王国精灵</title>
<style>
:root {
  --bg: #fafafa; --fg: #1a1a1a; --card: #fff; --muted: #666;
  --border: #e5e5e5; --accent: #7c3aed; --accent2: #ec4899;
  --good: #16a34a; --warn: #ea580c; --err: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10; --fg: #f0f0f0; --card: #1a1a1d; --muted: #9ca3af;
    --border: #2a2a2d; --accent: #a78bfa; --accent2: #f472b6;
    --good: #4ade80; --warn: #fb923c; --err: #f87171;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.container { max-width: 680px; margin: 0 auto; padding: 24px 16px 60px; }
header { text-align: center; margin-bottom: 32px; }
header h1 { font-size: 28px; margin: 0 0 8px; background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; background-clip: text; color: transparent; }
header .subtitle { color: var(--muted); font-size: 14px; margin: 0; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; margin-bottom: 16px;
}
.card h2 { font-size: 22px; margin: 0 0 14px; }
.card h3 { font-size: 17px; margin: 0 0 12px; }
.card p { margin: 8px 0; }
.card ul { padding-left: 22px; margin: 8px 0; }
.card li { margin: 4px 0; }
.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border: none; border-radius: 10px; padding: 12px 32px;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
}
.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--border); color: var(--fg); }
.btn-secondary:hover { opacity: 0.8; }
.action-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.question-card { text-align: center; }
.progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2));
                 transition: width 0.3s; }
.q-num { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.q-text { font-size: 17px; font-weight: 500; margin: 14px 0 24px; }
.q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.q-option {
  background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
  padding: 16px 14px; cursor: pointer; font-size: 14px; line-height: 1.5;
  text-align: left; transition: all 0.2s;
}
.q-option:hover { border-color: var(--accent); background: var(--card); }
.q-option.selected-a { border-color: var(--accent); background: linear-gradient(135deg, rgba(124,58,237,0.08), rgba(124,58,237,0.04)); }
.q-option.selected-b { border-color: var(--accent2); background: linear-gradient(135deg, rgba(236,72,153,0.08), rgba(236,72,153,0.04)); }
.q-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.q-nav { display: flex; justify-content: space-between; margin-top: 24px; }

/* 分享卡 */
.share-card {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white; border-radius: 16px; padding: 28px; text-align: center;
  margin-bottom: 16px; box-shadow: 0 4px 20px rgba(124,58,237,0.2);
}
.share-card .big-type { font-size: 32px; font-weight: 800; margin: 8px 0; letter-spacing: 1px; }
.share-card .kinsey { font-size: 14px; opacity: 0.95; margin-top: 4px; }
.share-card .sprite-img {
  width: 180px; height: 180px; object-fit: contain; background: rgba(255,255,255,0.15);
  border-radius: 50%; padding: 12px; margin: 8px auto; display: block;
}
.share-card .sprite-img-wrap { display: flex; justify-content: center; }
.share-card .sprite-emoji { font-size: 120px; line-height: 1; margin: 8px 0; }

/* 6 项种族值 */
.stats-grid { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.stat-row { display: grid; grid-template-columns: 80px 1fr 40px; align-items: center; gap: 10px; }
.stat-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.stat-bar { height: 16px; background: var(--border); border-radius: 8px; overflow: hidden; position: relative; }
.stat-fill {
  height: 100%; min-width: 4px; display: block; border-radius: 8px;
  transition: width 0.6s ease;
}
.stat-val { font-size: 14px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.stat-explain {
  font-size: 12px; color: var(--muted); line-height: 1.6;
  padding: 2px 0 10px 90px; margin: 0;
}

/* 组队精灵 */
.mate-block { text-align: center; padding: 16px 0 8px; }
.mate-img-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
.mate-img {
  width: 120px; height: 120px; object-fit: contain; background: var(--bg);
  border-radius: 50%; padding: 8px; border: 2px solid var(--border);
  display: block;
}
.mate-emoji { font-size: 80px; line-height: 1; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 50%; border: 2px solid var(--border); }
.mate-name { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
.mate-attr { color: var(--muted); font-size: 13px; }

/* 血脉 + 稀有度 */
.blood-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.blood-cell {
  border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; text-align: center;
  background: var(--bg);
}
.blood-cell b { display: block; font-size: 13px; margin-bottom: 4px; }
.blood-cell span { font-size: 11px; color: var(--muted); }
.blood-cell.active { border-color: var(--accent); background: linear-gradient(135deg, rgba(124,58,237,0.05), rgba(236,72,153,0.05)); }
.blood-emoji { font-size: 32px; line-height: 1; }

/* 结果板块 */
.result-section h3 { color: var(--accent); }
.disclaimer { color: var(--muted); font-size: 13px; line-height: 1.5; }
.error-msg { color: var(--err); font-size: 13px; }

/* 隐藏款 */
.share-card.hidden-card {
  background: linear-gradient(135deg, #1e1b4b, #7c3aed 40%, #db2777 70%, #fbbf24);
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 4px 20px rgba(124,58,237,0.4), 0 0 40px rgba(251,191,36,0.2); }
  50% { box-shadow: 0 4px 30px rgba(124,58,237,0.6), 0 0 60px rgba(251,191,36,0.4); }
}

.footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; line-height: 1.5; }
</style>

// 性格 ↔ 精灵 映射（用 MBTI 4 维）
function pickSprite(dims, pcts, role_score) {
  const e = dims.ei >= 0 ? 'E' : 'I';
  const s = dims.sn >= 0 ? 'S' : 'N';
  const t = dims.tf >= 0 ? 'T' : 'F';
  const j = dims.jp >= 0 ? 'J' : 'P';
  const minPct = Math.min(pcts.ei, pcts.sn, pcts.tf, pcts.jp);

  // 最最隐藏款：龙息帕尔（触发条件比迪莫还严苛）
  // 4 维都 > 80% + 角色倾向绝对值 > 0.85 + 极端 INTJ/INTP/INFJ/INFP 组合
  if (minPct > 80 && Math.abs(role_score) > 0.85) {
    if ((e === 'I' && s === 'N' && t === 'T' && j === 'J') ||
        (e === 'I' && s === 'N' && t === 'T' && j === 'P') ||
        (e === 'I' && s === 'N' && t === 'F' && j === 'J') ||
        (e === 'I' && s === 'N' && t === 'F' && j === 'P')) {
      return 'longxi';
    }
  }

  // 隐藏款：迪莫，触发条件 - 4 维都极强 + 极端组合
  if (minPct > 65 && ((e === 'I' && s === 'N' && t === 'T' && j === 'J') ||
                      (e === 'I' && s === 'N' && t === 'T' && j === 'P'))) {
    return 'demo';
  }

  // 主动/外向/逻辑 → 火花、皇家狮鹫、绅士鸡、棋绮后
  if (e === 'E' && t === 'T' && j === 'J') return 'shihou';  // 皇家狮鹫
  if (e === 'E' && t === 'T' && j === 'P') return 'huohua';  // 火花
  if (e === 'E' && t === 'F' && j === 'J') return 'shenshi'; // 绅士鸡
  if (e === 'I' && t === 'T' && j === 'J') return 'qiqi';   // 棋绮后
  if (e === 'I' && t === 'F' && j === 'J') return 'ermao';  // 大耳帽兜
  if (e === 'I' && t === 'F' && j === 'P') return 'shuilan'; // 水蓝蓝
  if (e === 'E' && t === 'F' && j === 'P') return 'yaji';   // 鸭吉吉
  if (e === 'I' && t === 'T' && j === 'P') return 'xingguang'; // 星光狮
  if (e === 'E' && t === 'F') return 'numao';               // 怒目怂猫
  if (e === 'I' && t === 'F') return 'xiaoye';              // 小夜
  if (e === 'E' && t === 'T') return 'emod';                // 恶魔叮
  if (e === 'I' && t === 'T') return 'cdie';                // 彩蝶鲨
  if (s === 'N') return 'xingguang';
  if (s === 'S') return 'miaomiao';                         // 喵喵 fallback
  return 'miaomiao';
}

// 血脉判定
function pickBloodline(role_score) {
  if (role_score > 0.6) return { type: '奇异', desc: '最强血脉，全服罕见。你的强势让周围的精灵都被你感染。', emoji: '🔴', tier: 3 };
  if (role_score > 0.3) return { type: '污染', desc: '稀有血脉，黑暗而强大。'  , emoji: '🟠', tier: 2 };
  if (role_score < -0.6) return { type: '奇异', desc: '最强血脉，全服罕见。你柔中带刚，独一无二。', emoji: '🔴', tier: 3 };
  if (role_score < -0.3) return { type: '污染', desc: '稀有血脉，温柔中藏着不可测的深度。', emoji: '🟠', tier: 2 };
  if (role_score > 0.1) return { type: '混血', desc: '你的血脉与自身属性略有不同，自带特殊能力。', emoji: '🟡', tier: 1 };
  if (role_score < -0.1) return { type: '混血', desc: '你的血脉与自身属性略有不同，潜力待开发。', emoji: '🟡', tier: 1 };
  return { type: '普通', desc: '纯净血脉，与自身属性完全一致，稳如磐石。', emoji: '🟢', tier: 0 };
}

// 稀有度判定
function pickRarity(sprite, bloodline, role_score) {
  let rarity = sprite.baseRarity;
  // 血脉加成
  if (bloodline.type === '奇异') rarity = '传说·异脉';
  else if (bloodline.type === '污染') rarity = '超稀有·异脉';
  else if (bloodline.type === '混血') rarity = rarity + '·混血';
  // 异色 / 炫彩（极小概率，由 role 分数绝对值 > 0.7 触发）
  const abs = Math.abs(role_score);
  if (abs > 0.7) rarity = rarity + '·炫彩';
  else if (abs > 0.5) rarity = rarity + '·异色';
  return rarity;
}

// 最佳阵容搭配（同款性格 / 互补性格）
function pickBestMate(dims) {
  const e = dims.ei >= 0 ? 'E' : 'I';
  const t = dims.tf >= 0 ? 'T' : 'F';
  // 互补：外向 + 内向 配对
  if (e === 'E' && t === 'T') return 'xiaoye';
  if (e === 'E' && t === 'F') return 'xingguang';
  if (e === 'I' && t === 'T') return 'yaji';
  if (e === 'I' && t === 'F') return 'emod';
  return 'miaomiao';
}

// 组队方向（基于你+队友的属性、定位、特质）
function pickMateStrategy(you, mate) {
  // 你 + 队友的属性克制关系
  const advantageMap = {
    '火': { beats: '草', weak: '水' },
    '草': { beats: '水', weak: '火' },
    '水': { beats: '火', weak: '草' },
    '光': { beats: '暗', weak: '无' },
    '暗': { beats: '光', weak: '无' },
    '翼': { beats: '草', weak: '电' },
    '武': { beats: '普通', weak: '无' },
    '魔': { beats: '无', weak: '光' },
    '龙': { beats: '无', weak: '无' },
    '普通': { beats: '无', weak: '武' },
  };
  const yourAttr = advantageMap[you.attr] || { beats: '无', weak: '无' };
  const mateAttr = advantageMap[mate.attr] || { beats: '无', weak: '无' };
  let relation = '';
  if (yourAttr.beats === mate.attr) relation = `你的 ${you.attr}属性 克制 ta 的 ${mate.attr}属性（你打 ta 痛）`;
  else if (yourAttr.weak === mate.attr) relation = `ta 的 ${mate.attr}属性 克制你的 ${you.attr}属性（注意协同抗打击）`;
  else relation = `属性间互不克制，可灵活搭配`;
  // 性格互补（用 if/else 更安全）
  function classifyType(t) {
    if (t.includes('领袖') || t.includes('保护')) return '进攻型';
    if (t.includes('辅助') || t.includes('治愈')) return '辅助型';
    if (t.includes('速攻') || t.includes('行动')) return '速攻型';
    return '平衡型';
  }
  const youType = classifyType(you.type);
  const mateType = classifyType(mate.type);
  let strategy = '';
  if (youType === '进攻型' && mateType === '辅助型') strategy = '你负责输出，ta 负责加血/减伤，经典输出流';
  else if (youType === '辅助型' && mateType === '进攻型') strategy = 'ta 负责输出，你负责奶/控场，经典辅助流';
  else if (youType === '速攻型' && mateType === '辅助型') strategy = 'ta 给你加速/减伤，你闪电战，速战速决';
  else if (youType === '速攻型' && mateType === '速攻型') strategy = '双速攻先手，秒掉一个就赢，但续航差';
  else if (youType === '进攻型' && mateType === '进攻型') strategy = '双输出暴力队，速战速决但缺乏续航';
  else if (youType === '辅助型' && mateType === '辅助型') strategy = '双辅助拉锯战，靠消耗取胜';
  else strategy = '均衡搭配，攻守兼备';
  return `${relation}。${strategy}。`;
}
</script>
<script>
// ========== 主程序 ==========
const state = { step: 0, answers: new Array(75).fill(null) };

function begin() {
  state.step = 0;
  state.answers = new Array(75).fill(null);
  renderQuestion();
}

function renderIntro() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>🐾 欢迎来到洛克王国世界</h2>
      <p>通过 <b>75 道选择题</b>，我们会从 6 个维度画出你的"精灵种族值"，从 <b>15 个经典精灵</b> 中找出最像你的那一只（外加 1 个隐藏款迪莫 + 1 个最最隐藏款龙息帕尔）。</p>
      <p>测完你会得到：</p>
      <ul>
        <li>🐾 <b>你的洛克王国精灵</b>（名字 + 真实图片，引用自 B站 Wiki）</li>
        <li>🎨 <b>你的属性与定位</b>（草/水/火/翼/光/暗/...）</li>
        <li>📊 <b>6 项种族值</b>（生命/物攻/魔攻/物防/魔防/速度）</li>
        <li>🩸 <b>血脉 + 稀有度</b>（普通/混血/污染/奇异 · 异色/炫彩）</li>
        <li>📜 <b>训练师指南</b>（培养路线 / 出战风格 / 配队建议）</li>
        <li>🐾 <b>最佳组队精灵</b>（最匹配的另一位）</li>
      </ul>
      <p>预计 10-15 分钟。所有数据 <b>只在你的浏览器里</b>，<b>不会上传任何地方</b>。</p>
      <p class="disclaimer">⚠️ <b>免责声明</b>：本测试仅供娱乐和群友间的玩笑，<b>不能</b>作为任何专业心理评估。本项目是<b>非商业</b>粉丝作品，所有精灵图片来源于 B站 Wiki（<b>CC BY-NC-SA 4.0</b>），版权属于腾讯游戏《洛克王国世界》原作方。</p>
      <div style="text-align:center;margin-top:24px">
        <button class="btn" onclick="begin()">我了解，开始</button>
      </div>
    </div>`;
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  const pct = (state.step / 75) * 100;
  const a = state.answers[state.step];
  document.getElementById('app').innerHTML = `
    <div class="question-card card">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="q-num">第 ${state.step + 1} / 75 题</div>
      <div class="q-text">${q.a}</div>
      <div style="color:var(--muted);text-align:center;margin:-14px 0 18px">——或者——</div>
      <div class="q-text">${q.b}</div>
      <div class="q-options">
        <div class="q-option ${a === 'a' ? 'selected-a' : ''}" onclick="answer('a')">
          <div class="q-label">A</div>${q.a}
        </div>
        <div class="q-option ${a === 'b' ? 'selected-b' : ''}" onclick="answer('b')">
          <div class="q-label">B</div>${q.b}
        </div>
      </div>
      <div class="q-nav">
        <button class="btn btn-secondary" onclick="prev()" ${state.step === 0 ? 'disabled' : ''}>← 上一题</button>
        <button class="btn" onclick="next()" ${a == null ? 'disabled' : ''}>${state.step === 74 ? '看结果' : '下一题 →'}</button>
      </div>
    </div>`;
}

function answer(val) {
  state.answers[state.step] = val;
  renderQuestion();
  // 自动跳到下一题（300ms）
  if (state.step < 74) {
    setTimeout(() => { state.step++; renderQuestion(); }, 300);
  }
}
function prev() { if (state.step > 0) { state.step--; renderQuestion(); } }
function next() {
  if (state.answers[state.step] == null) return;
  if (state.step < 74) { state.step++; renderQuestion(); }
  else { renderResult(); }
}

function score() {
  const dims = { ei: 0, sn: 0, tf: 0, jp: 0 };
  QUESTIONS.forEach((q, i) => {
    if (q.sec !== 'mbti') return;
    const a = state.answers[i];
    if (a == null) return;
    const sign = a === 'a' ? q.pole : -q.pole;
    dims[q.dim] += sign;
  });
  const mbti_pcts = {
    ei: Math.round((Math.abs(dims.ei) / 15) * 100),
    sn: Math.round((Math.abs(dims.sn) / 15) * 100),
    tf: Math.round((Math.abs(dims.tf) / 15) * 100),
    jp: Math.round((Math.abs(dims.jp) / 15) * 100),
  };
  // 角色倾向
  let role_total = 0, role_n = 0;
  QUESTIONS.forEach((q, i) => {
    if (q.sec !== 'role') return;
    const a = state.answers[i];
    if (a == null) return;
    const sign = a === 'a' ? q.pole : -q.pole;
    role_total += sign;
    role_n++;
  });
  const role_score = role_n > 0 ? role_total / role_n : 0;

  // 6 项种族值（基于 MBTI 4 维）
  function statFromDims(formula) {
    let s = 50;
    s += (dims.ei / 15) * (formula.ei || 0) * 50;
    s += (dims.sn / 15) * (formula.sn || 0) * 50;
    s += (dims.tf / 15) * (formula.tf || 0) * 50;
    s += (dims.jp / 15) * (formula.jp || 0) * 50;
    return Math.max(0, Math.min(100, Math.round(s)));
  }
  const stats = {
    hp:    { name: '❤️ 生命',   val: statFromDims({ ei: 0, sn: 0.3, tf: 0, jp: 0.5 }), desc: '续航 / 持久' },
    atk:   { name: '⚔️ 物攻',  val: statFromDims({ ei: 0.3, sn: 0, tf: 0.4, jp: -0.2 }), desc: '物理输出' },
    spatk: { name: '✨ 魔攻',  val: statFromDims({ ei: -0.2, sn: 0.4, tf: -0.3, jp: 0 }), desc: '魔法输出' },
    def:   { name: '🛡️ 物防',  val: statFromDims({ ei: 0, sn: 0.3, tf: 0.2, jp: 0.3 }), desc: '物理防御' },
    spdef: { name: '🔮 魔防',  val: statFromDims({ ei: 0, sn: 0, tf: -0.4, jp: 0.3 }), desc: '魔法防御' },
    spd:   { name: '💨 速度',  val: statFromDims({ ei: 0.3, sn: 0.3, tf: 0, jp: -0.5 }), desc: '出手速度' },
  };
  return { dims, mbti_pcts, role_score, stats };
}

function renderResult() {
  const s = score();
  const spriteKey = pickSprite(s.dims, s.mbti_pcts, s.role_score);
  const sprite = SPRITES[spriteKey];
  const bloodline = pickBloodline(s.role_score);
  const rarity = pickRarity(sprite, bloodline, s.role_score);
  const mateKey = pickBestMate(s.dims);
  const mate = SPRITES[mateKey];
  const isHidden = sprite.hidden || sprite.ultraHidden;

  // 种族值排序
  const statList = Object.entries(s.stats).map(([key, stat]) => ({ ...stat, key })).sort((a, b) => b.val - a.val);
  const top1 = statList[0];
  const bot1 = statList[statList.length - 1];

  // 主卡精灵图：img 标签 + emoji fallback
  // 当 imgUrl 为空或加载失败时显示 emoji
  const spriteBlock = sprite.imgUrl
    ? `<div class="sprite-img-wrap">
         <img class="sprite-img" src="${sprite.imgUrl}" alt="${sprite.name}"
              onerror="this.parentElement.innerHTML='<div class=&quot;sprite-emoji&quot;>${sprite.emoji}</div>'">
       </div>`
    : `<div class="sprite-emoji">${sprite.emoji}</div>`;

  document.getElementById('app').innerHTML = `
    <div class="share-card ${isHidden ? 'hidden-card' : ''}">
      <div style="font-size:14px;opacity:0.95">你的洛克王国精灵是</div>
      ${spriteBlock}
      <div class="big-type">${sprite.name}</div>
      <div style="font-size:14px;opacity:0.95;margin-bottom:4px">${sprite.type} · ${sprite.attr}属性</div>
      <div class="kinsey">${rarity} · ${bloodline.type}血脉</div>
    </div>
    <div class="card result-section">
      <h3>📜 ${sprite.name}的精灵图鉴</h3>
      <p style="white-space:pre-line">${sprite.desc}</p>
    </div>
    <div class="card result-section">
      <h3>📜 训练师指南</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px">根据你的精灵定位、最高种族值、血脉和稀有度生成。</p>
      <ul style="padding-left:0;list-style:none">
        ${renderTrainerGuideList(sprite, s.stats, bloodline, rarity)}
      </ul>
    </div>
    <div class="card result-section" style="background:linear-gradient(135deg,rgba(124,58,237,0.04),rgba(236,72,153,0.04));border:1.5px solid rgba(124,58,237,0.2)">
      <h3>📊 你的 6 项种族值</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px">基于 60 道性格题计算 · 满分 100 · 来自洛克王国世界的种族值系统</p>
      <div class="stats-grid">
        ${statList.map(stat => {
          const color = stat.val >= 70 ? 'var(--good)' : stat.val <= 30 ? 'var(--muted)' : 'var(--accent)';
          return `<div class="stat-row">
            <div class="stat-label">${stat.name}</div>
            <div class="stat-bar">
              <div class="stat-fill" style="width:${stat.val}%;background:linear-gradient(90deg,${color},${color})"></div>
            </div>
            <div class="stat-val" style="color:${color}">${stat.val}</div>
          </div>
          <div class="stat-explain">${STAT_EXPLAIN[stat.key] || ''}</div>`;
        }).join('')}
      </div>
      <div style="margin-top:14px;padding:10px 14px;background:rgba(124,58,237,0.08);border-radius:8px;font-size:13px">
        🏆 <b>最高：</b>${top1.name} (${top1.val}) · ${top1.desc}<br>
        🌑 <b>最低：</b>${bot1.name} (${bot1.val}) · ${bot1.desc}
      </div>
    </div>
    <div class="card result-section">
      <h3>🩸 你的血脉 & 稀有度</h3>
      <div class="blood-bar">
        <div class="blood-cell active">
          <div class="blood-emoji">${bloodline.emoji}</div>
          <b>${bloodline.type}血脉</b>
          <span>${bloodline.desc}</span>
        </div>
        <div class="blood-cell active">
          <div class="blood-emoji">⭐</div>
          <b>${rarity}</b>
          <span>基于精灵基础稀有度 + 血脉 + 强度综合判定</span>
        </div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">📌 血脉说明：<b>普通</b>（与自身属性一致）→ <b>混血</b>（属性不同）→ <b>污染</b>（稀有）→ <b>奇异</b>（最稀有）。异色/炫彩在血脉强度高时解锁。</p>
    </div>
    <div class="card result-section">
      <h3>🐾 你的组队精灵</h3>
      <div class="mate-block">
        <div class="mate-img-wrap">
          <img class="mate-img" src="${mate.imgUrl || ''}" alt="${mate.name}"
               onerror="this.parentElement.innerHTML='<div class=&quot;mate-emoji&quot;>${mate.emoji}</div>'">
        </div>
        <div class="mate-name">${mate.name}</div>
        <div class="mate-attr">${mate.attr}属性 · ${mate.type}</div>
      </div>
      <p style="margin-top:14px"><b>${mate.name}</b> 是一只<strong>${mate.attr}属性</strong>的精灵，性格特质是 <b>${mate.trait}</b>。</p>
      <p style="margin-top:8px;color:var(--muted);font-size:13px">${mate.desc.split('\n')[0]}</p>
      <p style="margin-top:10px">🛡️ <b>组队方向：</b>${pickMateStrategy(sprite, mate)}</p>
    </div>
    <div class="card result-section">
      <h3>📤 分享 / 保存</h3>
      <p>把结果分享给群友，或导出留档。</p>
      <div class="action-row">
        <button class="btn" onclick="downloadJSON()">导出 JSON</button>
        <button class="btn btn-secondary" onclick="downloadText()">导出文本</button>
        <button class="btn btn-secondary" onclick="copyShare()">复制分享文字</button>
        <button class="btn btn-secondary" onclick="restart()">重新测试</button>
      </div>
      <div id="copy-msg" class="error-msg" style="color:var(--good);display:none;margin-top:10px">已复制到剪贴板！</div>
    </div>
    <div class="card">
      <p class="disclaimer">
        <b>⚠️ 重要提醒</b><br>
        · 本测试仅供娱乐和群友间的玩笑，<b>不能替代专业心理评估</b><br>
        · 精灵图鉴是简化标签，真实的你比任何一只精灵都更丰富<br>
        · 结果只反映你"那一刻的状态"，不是永久标签<br>
        · 所有数据<b>只存在你的浏览器</b>，关页面就消失<br>
        · 图片来源于 <a href="https://wiki.biligame.com/rocom/" target="_blank" style="color:var(--accent)">B站洛克王国 Wiki</a>，遵循 <b>CC BY-NC-SA 4.0</b> 协议<br>
        · 洛克王国世界 © 腾讯游戏，本项目 <b>非商业</b>
      </p>
    </div>`;
}

function restart() { state.step = 0; state.answers = new Array(75).fill(null); renderIntro(); }

// 训练师指南：把原来的聊天提示转成洛克王国测试语境
function renderTrainerGuide(sprite, stats, bloodline, rarity) {
  const statList = Object.entries(stats).map(([key, stat]) => ({ key, ...stat })).sort((a, b) => b.val - a.val);
  const top = statList[0];
  const low = statList[statList.length - 1];
  const lines = [
    `你的核心打法偏向 <b>${sprite.type}</b>，最适合走 <b>${top.name}</b> 优先的培养路线。`,
    `${top.name} 高，说明你这只精灵在队伍里最擅长发挥「${top.desc}」这类作用。`,
    `${low.name} 偏低，代表你不适合硬吃这类压力，最好让组队精灵帮你补位。`,
    `${bloodline.type}血脉 + ${rarity}，说明你的稀有感主要来自「${bloodline.desc}」。`,
    `实战建议：别把自己当万能精灵用，围绕 ${sprite.attr}属性 和 ${top.name} 优势配队，效果最好。`,
  ];
  return lines;
}

function renderTrainerGuideList(sprite, stats, bloodline, rarity) {
  return renderTrainerGuide(sprite, stats, bloodline, rarity)
    .map(t => `<li style="padding:8px 0;border-bottom:1px dashed var(--border)">· ${t}</li>`)
    .join('');
}

function renderTrainerGuideText(sprite, stats, bloodline, rarity) {
  return renderTrainerGuide(sprite, stats, bloodline, rarity)
    .map(l => '  · ' + l.replace(/<[^>]*>/g, ''))
    .join('\n');
}

function downloadJSON() {
  const s = score();
  const spriteKey = pickSprite(s.dims, s.mbti_pcts, s.role_score);
  const sprite = SPRITES[spriteKey];
  const bloodline = pickBloodline(s.role_score);
  const rarity = pickRarity(sprite, bloodline, s.role_score);
  const data = {
    timestamp: new Date().toISOString(),
    sprite: { key: spriteKey, name: sprite.name, emoji: sprite.emoji, attr: sprite.attr, type: sprite.type, hidden: !!sprite.hidden, ultraHidden: !!sprite.ultraHidden },
    stats: s.stats,
    bloodline: bloodline.type,
    rarity: rarity,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `my-roco-pet-${spriteKey}-${Date.now()}.json`;
  a.click();
}

function downloadText() {
  const s = score();
  const spriteKey = pickSprite(s.dims, s.mbti_pcts, s.role_score);
  const sprite = SPRITES[spriteKey];
  const bloodline = pickBloodline(s.role_score);
  const rarity = pickRarity(sprite, bloodline, s.role_score);
  const txt = `🐾 测试你是什么洛克王国精灵
================
时间: ${new Date().toLocaleString('zh-CN')}

你的洛克王国精灵: ${sprite.emoji} ${sprite.name}
属性: ${sprite.attr}属性
定位: ${sprite.type}
稀有度: ${rarity}
血脉: ${bloodline.type} (${bloodline.desc})

你的画像:
${sprite.desc}

训练师指南:
${renderTrainerGuideText(sprite, s.stats, bloodline, rarity)}

📊 6 项种族值:
${Object.values(s.stats).map(st => `  ${st.name}: ${st.val}`).join('\n')}

—— 本测试仅供娱乐，不代表任何专业评估 ——
图片来源: B站洛克王国 Wiki (CC BY-NC-SA 4.0)
`;
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `my-roco-pet-${spriteKey}-${Date.now()}.txt`;
  a.click();
}

function copyShare() {
  const s = score();
  const spriteKey = pickSprite(s.dims, s.mbti_pcts, s.role_score);
  const sprite = SPRITES[spriteKey];
  const bloodline = pickBloodline(s.role_score);
  const rarity = pickRarity(sprite, bloodline, s.role_score);
  const txt = `🐾 我刚测了个"测试你是什么洛克王国精灵"——

我的精灵是 ${sprite.emoji} ${sprite.name}（${sprite.attr}属性）
定位: ${sprite.type}
稀有度: ${rarity}
血脉: ${bloodline.type}

${sprite.desc.split('\n')[0]}

也来看看你会是哪只洛克王国精灵 🐾
`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => {
      const msg = document.getElementById('copy-msg');
      if (msg) { msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 3000); }
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    const msg = document.getElementById('copy-msg');
    if (msg) { msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 3000); }
  }
}

renderIntro();
</script>
